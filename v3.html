<style>
:root{
  /* Concept: one full-height app on slow-drifting colour blobs; every card is a glass lens, grouped by tone (sound, controls, connection, device). */
  --bg:#000;
  --card:#1c1c1e;
  --ink:#f5f7ff;
  --mut:#8e8e93;
  --faint:#636366;
  --line:#2c2c2e;
  --accent:#1e8cf0;
  --ok:#34c759;
  --warn:#ff9f0a;
  --bad:#ff453a;
  --blob1:#2457ff;
  --blob2:#a63bff;
  --blob3:#00cdbd;
  --blob4:#ff6f4d;
  --tone-sound:#3d8bff;
  --tone-ctrl:#8f6bff;
  --tone-conn:#14b8a6;
  --tone-dev:#ff9a3d;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
h1,h2,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;overflow:hidden}

/* ---------- glass ---------- */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 44%,rgba(255,255,255,.1));
  -webkit-backdrop-filter:blur(26px) saturate(1.9) brightness(1.08);backdrop-filter:blur(26px) saturate(1.9) brightness(1.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1),inset 0 0 22px rgba(255,255,255,.05),0 16px 36px -10px rgba(0,0,0,.6)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;
  background:linear-gradient(140deg,rgba(255,255,255,.85),rgba(255,255,255,.1) 28%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;mix-blend-mode:screen;
  background:radial-gradient(120% 60% at 18% -12%,rgba(255,255,255,.24),transparent 56%)}

/* ---------- pages ---------- */
.pg{position:absolute;inset:0;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .35s}
.pg.under{transform:translateX(-26%);opacity:0;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;height:88px;z-index:4;pointer-events:none;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  background:linear-gradient(#000 40%,rgba(0,0,0,0));
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.nb{position:absolute;left:0;right:0;top:0;z-index:5;height:64px;padding:10px var(--gutter-r) 0 var(--gutter-l);display:flex;align-items:center;gap:12px}
.nb h1{flex:1;min-width:0;font-size:28px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb h2{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.c h2{text-align:center;padding-right:56px}
.sc{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:78px var(--gutter-r) 124px var(--gutter-l)}
.sc::-webkit-scrollbar{display:none}

.gb{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;touch-action:none;--px:50%;--py:50%;--dx:0px;--dy:0px;--s:1;
  transform:translate(var(--dx),var(--dy)) scale(var(--s));transition:transform .6s cubic-bezier(.3,1.7,.5,1),background .35s,box-shadow .35s}
.gb svg{width:20px;height:20px;transition:transform .3s}
.gb::after{mix-blend-mode:normal;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--px) var(--py),rgba(255,255,255,.8),rgba(255,255,255,.12) 45%,transparent 70%)}
.gb.pr{--s:1.28;transition:transform .16s ease-out,background .2s,box-shadow .2s;
  box-shadow:inset 0 0 0 .8px rgba(255,255,255,.5),inset 2px 2px 3px -1px rgba(255,255,255,.9),inset -2px -2px 3px -1px rgba(255,255,255,.4),0 0 26px rgba(255,255,255,.24),0 10px 28px rgba(0,0,0,.45)}
.gb.pr::after{opacity:1}
.gb.pr svg{transform:scale(1.15)}

/* ---------- hero ---------- */
.hero{display:flex;justify-content:center;align-items:flex-start;gap:26px;padding:6px 0 4px;animation:fi .7s cubic-bezier(.32,.72,0,1)}
@keyframes fi{from{opacity:0;transform:scale(.94);filter:blur(8px)}}
.dv{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.dv img{display:block;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.rings{display:flex;gap:14px}
.rg-w{display:flex;flex-direction:column;align-items:center;gap:4px}
.rg circle:last-of-type{animation:rg 1.1s cubic-bezier(.32,.72,0,1)}
@keyframes rg{from{stroke-dashoffset:var(--c)}}
.state{margin-top:6px;text-align:center;font-size:13px;color:var(--mut)}
.state b{color:var(--ok);font-weight:600}

/* ---------- sections ---------- */
.lb{font-size:13px;color:var(--mut);margin:14px 6px 8px;line-height:18px}
.sh{font-size:13px;color:var(--mut);padding:10px 6px 8px;line-height:18px}
.ft{font-size:13px;color:var(--mut);padding:0 6px 14px;line-height:18px;margin-top:-4px}
.cd{background:var(--card);border-radius:26px;margin:0 0 12px;overflow:hidden}
.cd[data-tone="sound"]{--tone:var(--tone-sound)}
.cd[data-tone="ctrl"]{--tone:var(--tone-ctrl)}
.cd[data-tone="conn"]{--tone:var(--tone-conn)}
.cd[data-tone="dev"]{--tone:var(--tone-dev)}
.cd{--sep:51px}
.cd.plain{--sep:16px}
.row{position:relative;z-index:1;display:flex;align-items:center;gap:13px;min-height:52px;padding:6px 14px 6px 16px;width:100%;font-size:17px;line-height:22px;transition:background .2s}
.row+.row::after{content:"";position:absolute;top:0;left:var(--sep);right:0;height:.5px;background:var(--line)}
.cd.plain .row{padding-left:16px}
.ic{flex:none;width:22px;height:22px;display:grid;place-items:center;color:#e5e5ea}
.ic svg{width:20px;height:20px}
.tx{flex:1;min-width:0;display:block}
.tx small{display:block;font-size:13px;color:var(--mut);line-height:17px;margin-top:1px}
.tx small.bl{color:var(--accent)}
.row em{font-style:normal;color:var(--mut);font-size:16px}
.cv{width:8px;height:14px;color:var(--faint);flex:none}
button.row,button.tx{cursor:pointer}
.nv:active,.rd:active,.ck:active,.bt:active{background:#2c2c2e}
.bt{justify-content:center;color:var(--accent);font-weight:500}
.pp{font-size:16px;line-height:24px;color:#ebebf5}
.rd svg,.ck svg{width:18px;height:18px;color:var(--accent);opacity:0;transition:opacity .2s}
.sel svg{opacity:1!important}

/* toggle: liquid glass */
.tg{position:relative;flex:none;width:60px;height:28px;border-radius:14px;background:#2a2a2c;touch-action:none;--d:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.07);transition:background .35s}
.tg.on{background:var(--ok);--d:1}
.tg b{position:absolute;top:2px;left:2px;width:38px;height:24px;border-radius:12px;pointer-events:none;translate:calc(var(--d)*18px) 0;scale:1 1;
  background:linear-gradient(180deg,#fff,#e9ebf2);-webkit-backdrop-filter:blur(0) saturate(1) brightness(1);backdrop-filter:blur(0) saturate(1) brightness(1);
