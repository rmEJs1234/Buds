<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>갈무리 발표 대본</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 어두운 강당에서 눈부시지 않게: 검정 바탕, 말할 문장은 크고 밝게, 행동 지시는 흐리게 */
:root{--bg:#000;--panel:#1C1C1E;--ink:#fff;--sub:#98989F;--faint:#5C5C61;--g:#fff;--gd:#2C2C2E;--line:rgba(255,255,255,.07);--fs:27px;
 --ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
/* 사파리 아래 툴바 자리는 html 배경색으로 칠해져서 툴바 색과 맞춘다. 위 상태바는 theme-color로 검정 */
html{height:100%;background:#1C1C1E;overflow:hidden;overscroll-behavior:none}
body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);word-break:keep-all;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
.app{touch-action:none;position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 0 0}
/* 위 */
.top{display:flex;align-items:center;gap:12px;padding:6px 20px 14px;position:relative;z-index:3}
.ib{flex:none;width:42px;height:42px;border-radius:21px;border:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;cursor:pointer}
.ib:active{transform:scale(.92)}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.05em}
.sec{height:28px;padding:0 12px;border-radius:14px;background:var(--panel);color:var(--sub);font-size:13px;font-weight:800;display:inline-flex;align-items:center}
.cnt{margin-left:auto;font:700 15px/1 Pretendard,sans-serif;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:3px;margin:0 20px;border-radius:2px;background:var(--line);overflow:hidden;position:relative;z-index:3}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:2px;transition:width .5s var(--ease)}
/* 가운데 */
.stage{flex:1;position:relative;overflow:hidden}
.card{position:absolute;inset:0;overflow-y:auto;padding:30px 24px 64px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.card .in{max-width:880px;margin:0 auto}
.no{display:flex;align-items:baseline;gap:12px}
.no b{font-family:'Bricolage Grotesque',Pretendard,sans-serif;font-weight:800;font-size:calc(var(--fs)*2.2);line-height:1;letter-spacing:-.05em;color:var(--ink)}
.no span{font-size:calc(var(--fs)*.72);font-weight:700;color:var(--sub);line-height:1.3}
.card.qa .no b{font-size:calc(var(--fs)*1.5)}
.card.qa .no span{font-size:calc(var(--fs)*.95);color:var(--ink);font-weight:800}
.ls{margin-top:28px;display:grid;gap:22px}
.say{font-size:var(--fs);line-height:1.62;font-weight:600;letter-spacing:-.012em}
.say .c{color:var(--faint);font-weight:500;font-size:.78em}
.cue{font-size:calc(var(--fs)*.74);line-height:1.5;font-weight:600;color:var(--sub);padding:12px 16px;border-radius:14px;background:var(--panel);box-shadow:inset 3px 0 0 var(--faint)}
.nx{display:inline-flex;align-items:center;gap:4px;height:1.25em;padding:0 .5em;margin-left:.2em;border-radius:.62em;background:#2BD877;color:#000;font-size:.62em;font-weight:800;vertical-align:.22em;letter-spacing:0}
.nx svg{width:.9em;height:.9em}
/* 장 바뀌는 움직임 */
.card{will-change:transform,opacity}
.card.enter-r{animation:inR .42s var(--ease) both}.card.enter-l{animation:inL .42s var(--ease) both}
.card.leave-r{animation:outL .32s var(--ease) both}.card.leave-l{animation:outR .32s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(56px)}}@keyframes inL{from{opacity:0;transform:translateX(-56px)}}
@keyframes outL{to{opacity:0;transform:translateX(-56px)}}@keyframes outR{to{opacity:0;transform:translateX(56px)}}
/* 누르는 자리: 왼쪽 반은 이전, 오른쪽 반은 다음 */
.tap{touch-action:none;position:absolute;top:0;bottom:0;width:50%;z-index:2;border:0;background:transparent;cursor:pointer}
.tap.l{left:0}.tap.r{right:0}
.flash{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;z-index:1;opacity:0}
.flash.l{left:0;background:linear-gradient(90deg,rgba(255,255,255,.06),transparent)}.flash.r{right:0;background:linear-gradient(-90deg,rgba(255,255,255,.06),transparent)}
.flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
/* 아래: 다음 장 미리 보기 */
.foot{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px max(8px,calc(env(safe-area-inset-bottom) - 12px));position:relative;z-index:3;background:#1C1C1E;box-shadow:0 -1px 0 rgba(255,255,255,.07)}
.foot::after{content:'';position:absolute;left:0;right:0;top:100%;height:600px;background:#1C1C1E;pointer-events:none}
.foot::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:48px;background:linear-gradient(transparent,#000);pointer-events:none}
.foot .fb{flex:none;height:46px;min-width:50px;padding:0 12px;border-radius:23px;border:0;background:#2C2C2E;color:var(--ink);font:800 15px Pretendard,sans-serif;cursor:pointer}
.foot .fb:active{transform:scale(.94)}
.next{flex:1;min-width:0;height:46px;padding:0 4px 0 6px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--sub);overflow:hidden}
.next em{flex:none;font-style:normal;font-weight:800;color:var(--ink)}
.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:4;padding:10px 16px;border-radius:20px;background:rgba(28,28,30,.94);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;transition:opacity .5s}
.hint.off{opacity:0;pointer-events:none}
/* 목록 */
.sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;visibility:hidden}
.sheet.on{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .35s}
.sheet.on .scrim{opacity:1}
.pan{position:relative;max-height:84vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:#1C1C1E;box-shadow:inset 0 1px 0 var(--line);transform:translateY(100%);transition:transform .45s var(--ease);padding:12px 0 calc(env(safe-area-inset-bottom) + 12px)}
.sheet.on .pan{transform:none}
.ph{display:flex;align-items:center;gap:10px;padding:8px 20px 14px}
.ph b{font-size:19px;font-weight:800}
.fsz{margin-left:auto;display:flex;gap:6px}
.fsz button{height:38px;min-width:46px;padding:0 12px;border-radius:19px;border:0;background:#2C2C2E;color:var(--ink);font:800 15px Pretendard,sans-serif;box-shadow:inset 0 0 0 1px var(--line)}
.lst{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 12px 8px}
.lst h4{font-size:13px;font-weight:800;color:var(--sub);padding:16px 10px 6px}
.lst button{width:100%;display:flex;align-items:center;gap:14px;padding:12px 10px;border:0;border-radius:14px;background:transparent;color:var(--ink);font:600 16px Pretendard,sans-serif;text-align:left}
.lst button em{flex:none;width:64px;font-style:normal;font-weight:800;color:var(--sub);font-size:14px}
.lst button.cur{background:#2C2C2E}.lst button.cur em{color:var(--ink)}
/* 앱 고르는 화면이 흐려지며 사라진 걸 이어받아 선명해지며 나타난다 */
.app.in{animation:appIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes appIn{from{opacity:0;transform:scale(.94);filter:blur(12px)}}
@media (min-width:900px){:root{--fs:34px}.card{padding:48px 40px}}

</style>
</head>
<body>
<div class="app in">
  <div class="top">
    <a class="ib" href="./" aria-label="앱 고르는 화면으로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span class="brand">Galmuri.</span><span class="sec" id="sec">도입</span>
    <span class="cnt" id="cnt">1 / 1</span>
    <button class="ib" id="menu" aria-label="장 목록과 글자 크기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <button class="tap l" id="tl" aria-label="이전 장"></button><button class="tap r" id="tr" aria-label="다음 장"></button>
    <i class="flash l" id="fl"></i><i class="flash r" id="fr"></i>
  </div>
  <div class="foot"><div class="next" id="next"></div><button class="fb" id="fm2" aria-label="글자 작게">가−</button><button class="fb" id="fp2" aria-label="글자 크게">가+</button></div>
  <div class="hint" id="hint">왼쪽 탭탭은 이전 장, 오른쪽 탭탭은 다음 장</div>
</div>
<div class="sheet" id="sheet" aria-hidden="true"><div class="scrim" id="scrim"></div>
  <div class="pan"><div class="ph"><b>장 목록</b><div class="fsz"><button id="fm" aria-label="글자 작게">가−</button><button id="fp" aria-label="글자 크게">가+</button></div></div><div class="lst" id="lst"></div></div>
</div>
<script>
const S=[{"sec": "도입", "no": "시작 전", "t": "검은 화면", "l": ["(무대 중앙. 강당이 조용해질 때까지 3초 기다린다)", "여러분, 지금 집 냉장고에 뭐가 들어 있는지 다 기억나세요?", "(2초 쉬고)", "우유가 언제까지였는지, 작년에 산 청소기 보증이 언제 끝나는지, 서랍에 굴러다니는 이어폰을 지금 팔면 얼마나 받을 수 있는지. 아마 대부분 잘 모르실 거예요. 저희도 그랬습니다. [→]"]}, {"sec": "도입", "no": "1장", "t": "표지", "l": ["그래서 이런 질문에서 출발했어요. 살 때는 다들 도와주는데, 왜 산 다음에는 아무도 안 챙겨 줄까?", "그 답으로 만든 게 갈무리입니다. 안녕하세요, 사 놓고 잊어버린 물건을 대신 챙겨 주는 서비스, 갈무리를 만든 ○○○입니다. [→]"]}, {"sec": "도입", "no": "2장", "t": "왜 갈무리일까요", "l": ["갈무리, 처음 들으면 조금 낯선 말이죠. 사실 오래된 우리말이에요. 사전을 찾아보면 뜻이 두 가지 나옵니다. 하나는 물건을 잘 정리해서 간수하는 것, 다른 하나는 일을 끝까지 마무리하는 것.", "저희 서비스가 하려는 일이 딱 이 두 가지예요. 산 물건을 기억하고 챙겨 주는 것, 그리고 다 쓴 물건은 팔거나 고쳐서 끝까지 마무리해 주는 것. 그래서 이름을 갈무리로 지었습니다. [→]"]}, {"sec": "도입", "no": "3장", "t": "이런 적 있죠?", "l": ["혹시 이런 적 있으세요? (카드를 하나씩 가리키며) 냉장고 안쪽에서 우유를 꺼냈는데 기한이 이미 지나 있었던 적. 집에 계란이 있는 줄 모르고 마트에서 또 사 온 적. 무상수리 끝나자마자 청소기가 고장 난 적. 그리고 안 쓰는 이어폰, 팔려고 했는데 사진 찍고 글 쓰기 귀찮아서 그냥 서랍에 넣어 둔 적.", "다 다른 얘기 같지만 이유는 하나예요. 물건을 산 다음의 정보가 어디에도 남지 않는다는 거죠. 그래서 음식은 버려지고, 같은 걸 두 번 사고, 보증은 놓치고, 팔 수 있는 물건은 서랍에서 잠자게 됩니다. [→]"]}, {"sec": "도입", "no": "4장", "t": "갈무리가 대신 챙겨요", "l": ["갈무리는 바로 그 빈자리를 채워요. 우유가 내일까지라고, 계란은 아직 남았다고, 보증이 곧 끝난다고, 안 쓰는 이어폰은 지금 팔면 얼마라고. 필요한 순간에 먼저 알려 드립니다.", "그리고 알림을 한 번 누르면, 그걸로 끝이에요. [→]"]}, {"sec": "도입", "no": "5장", "t": "누가 쓰나요", "l": ["시장은 이미 충분히 큽니다. 국가데이터처가 작년 말에 발표한 통계를 보면, 1인 가구만 804만 가구, 전체의 36.1%로 역대 가장 많아요.", "그렇다고 1인 가구만 보는 건 아니에요. 물건을 사는 사람이라면 누구나 대상입니다. 온라인으로 장 보는 20~30대 1인 가구, 시간이 늘 부족한 30~40대 맞벌이 가정, 그리고 멀리 계신 부모님 댁까지 챙기고 싶은 자녀 세대까지. 나이마다 고민이 다르니까, 그 고민에 맞춰서 하나씩 풀어 드립니다. [→]"]}, {"sec": "도입", "no": "6장", "t": "병 하나 남은 만큼", "l": ["갈무리 화면은 단순해요. 물건 하나에 병 하나. 남은 만큼 물이 차 있고, 물이 줄어들수록 챙길 때가 가까워졌다는 뜻이에요. 숫자를 안 읽어도 한눈에 보이게 만들었습니다.", "그럼 이제 실제 앱으로 보여 드릴게요. [→]"]}, {"sec": "시연", "no": "7장", "t": "시연 1 · 처음 열면", "l": ["첫 번째, 시작이 쉬워야 합니다. 갈무리는 처음 열고 30초면 바로 쓸 수 있어요. [→]", "(시연 중) 이름 하나만 넣으면 끝이에요. 복잡한 가입도, 설명서도 없습니다. [→]"]}, {"sec": "시연", "no": "8장", "t": "시연 2 · 자동 등록", "l": ["두 번째, 입력할 게 없어야 해요. 물건을 하나하나 적어야 하는 앱은 솔직히 일주일도 못 갑니다. 그래서 갈무리는 결제하는 순간 알아서 들어와요. [→]", "(시연 중) 결제 알림에서 산 물건을 읽어 오고, 한 번 누르면 보관함에 쏙 들어갑니다.", "(바코드 화면이 뜨면) 영수증이 없는 물건은 바코드만 찍으면 돼요. 찍자마자 상품을 찾아서 이름이 채워지고, 기한은 달력에서 고르기만 하면 됩니다. [→]"]}, {"sec": "시연", "no": "9장", "t": "시연 3 · 오늘 갈무리", "l": ["세 번째, 매일 열 이유가 있어야 합니다. 앱을 열면 오늘 챙길 것만 맨 위에 딱 보여요. [→]", "(시연 중) 다 쓴 건 한 번에 정리하고요. 하루에 몇 초면 충분합니다. [→]"]}, {"sec": "시연", "no": "10장", "t": "시연 4 · 마트 알림", "l": ["마트에서 \"계란 집에 있었나?\" 하고 고민해 보신 적 있으시죠. 갈무리는 그 고민이 시작되기 전에 먼저 답해 줍니다. [→]", "(시연 중) 마트에 도착하면 바로 알려 줘요. 계란이랑 두부는 이미 집에 있다고요. 같은 걸 또 사는 일이 그 자리에서 없어집니다. [→]"]}, {"sec": "시연", "no": "11장", "t": "시연 5 · 3초 팔기", "l": ["안 쓰는 물건은 버리지 말고 돈으로 바꾸세요. [→]", "(시연 중) 판매 글은 갈무리가 미리 써 두고, 중고 거래 앱 두 곳에 한 번에 올려 줍니다. 그것도 귀찮으시면 갈무리가 직접 사 드려요. 사진을 보고 가격을 제안하고, 돈은 갈무리 머니로 바로 들어옵니다. [→]"]}, {"sec": "시연", "no": "12장", "t": "시연 6 · 갈무리 마켓", "l": ["이렇게 사들인 물건은 검수를 거쳐서 갈무리 마켓에서 다시 팔아요. [→]", "(시연 중) 등급이랑 새 제품보다 얼마나 싼지가 한눈에 보이고, 3개월 보증도 붙어요. 모르는 사람한테 중고 사는 거, 불안하잖아요. 그 불안을 갈무리가 대신 짊어집니다. [→]"]}, {"sec": "시연", "no": "13장", "t": "시연 7 · 수리 접수", "l": ["고장 나면 보통 서비스센터 전화번호부터 찾으시죠. 갈무리에서는 증상만 고르시면 돼요. [→]", "(시연 중) 언제 샀는지, 보증이 언제까지인지 이미 알고 있으니까, 접수하면 바로 기사님이 연락을 드립니다. [→]"]}, {"sec": "시연", "no": "14장", "t": "시연 8 · 가족", "l": ["갈무리는 가족이 같이 쓸 수도 있어요. [→]", "(시연 중) 어머니 물건만 따로 모아 볼 수 있어서, 멀리 떨어져 살아도 약이나 식품 기한을 자녀가 대신 챙겨 드릴 수 있습니다. [→]"]}, {"sec": "시연", "no": "15장", "t": "시연 9 · 손맛", "l": ["마지막으로, 손이 자꾸 가는 앱이어야 해요. 매일 여는 습관은 이런 작은 재미에서 생기거든요. [→]", "(시연 중) 옆으로 밀어서 정리하고, 끝까지 내리면 숨어 있던 병이 나와요. 누르면 병 안에서 거품이 보글보글 올라옵니다. (관객 반응이 나오면 1초 기다린다) [→]"]}, {"sec": "시연", "no": "16장", "t": "휴대폰에서도, 컴퓨터에서도", "l": ["같은 갈무리를 컴퓨터에서도 그대로 쓸 수 있어요. 화면 크기에 맞춰서 알아서 바뀝니다.", "여기까지가 제품이었고요, 이제 이걸로 어떻게 돈을 버는지 말씀드릴게요. [→]"]}, {"sec": "사업", "no": "17장", "t": "갈무리는 이렇게 벌어요", "l": ["갈무리 앱은 무료예요. 쓰는 사람이 많아질수록 마켓에 물건이 모이고, 물건이 모일수록 수익이 커지는 구조라서요.", "돈을 버는 방법은 세 가지입니다. 첫째, 갈무리 마켓에서 사고파는 차익. 둘째, 더 편하게 쓰고 싶은 분들의 구독료. 셋째, 쇼핑몰 재구매나 수리 접수를 연결해 주고 받는 제휴 수수료예요.", "(오른쪽 순환도를 가리키며) 사고, 쓰고, 팔고, 고치고. 물건 하나가 여러 주인을 거치는 동안, 단계마다 갈무리가 수익을 냅니다. [→]"]}, {"sec": "사업", "no": "18장", "t": "요금제", "l": ["요금제는 세 가지예요. 무료는 쇼핑몰 3곳 연결이랑 기한, 보증 알림까지. 플러스는 한 달에 2,900원인데, 쇼핑몰 31곳을 다 연결하고, 마트 도착 알림에, 갈무리에 팔면 5%를 더 드려요. 가족 요금제는 한 달 4,900원에 최대 다섯 명이 같이 쓰고, 부모님 약이랑 생필품까지 챙길 수 있습니다.", "중요한 건, 마켓이랑 팔기, 수리 접수는 어떤 요금제든 다 쓸 수 있다는 거예요. 돈이 도는 길은 누구한테나 열어 뒀습니다. [→]"]}, {"sec": "사업", "no": "19장", "t": "마무리", "l": ["(잠시 멈추고 강당 전체를 천천히 둘러본다)", "우리는 매일 뭔가를 삽니다. 그런데 산 다음을 챙겨 주는 서비스는 지금까지 없었어요.", "산 순간부터 다 쓸 때까지, 그리고 다음 주인에게 갈 때까지. 갈무리가 챙기겠습니다.", "화면에 있는 QR 코드를 찍으시면 지금 보신 갈무리를 직접 써 보실 수 있어요. (QR을 가리키고 3~5초 기다린다)", "(인사하지 말고 QR을 띄운 채 바로 아래 ‘19장 끝’으로 이어간다)"]}, {"sec": "출시 이후", "no": "19장 끝", "t": "넘어가기", "l": ["찍어 보시는 동안, 실제로 출시하면 뭘 더 붙일지 잠깐 말씀드릴게요. [→]"]}, {"sec": "출시 이후", "no": "20장", "t": "앱을 열지 않아도 보이게", "l": ["출시하면 제일 먼저 위젯을 붙일 거예요. 홈 화면만 봐도 오늘 챙길 거랑 남은 양이 보이고, 안 쓰는 물건을 팔면 얼마인지도 바로 보입니다.", "잠금 화면이나 워치에서는 앱을 안 열고도 \"다 먹었어요\"를 누를 수 있고, \"우유 있어?\" 하고 물어보면 음성으로 답해 줘요. 매일 여는 앱보다, 안 열어도 되는 앱. 그게 목표입니다. [→]"]}, {"sec": "출시 이후", "no": "21장", "t": "앞으로 이렇게 넓혀요", "l": ["계획은 세 단계예요. 출시 첫 달에는 넣는 수고를 없앱니다. 바코드를 진짜 상품 정보랑 연결하고, 영수증 사진만 찍어도 등록되게 할 거예요.", "6개월 안에는 카드사, 마이데이터로 알아서 들어오게 하고, 동네 마트 재고랑 가격까지 비교해 드리려고 합니다.", "1년 안에는 가전이랑 연결해서 고장을 미리 알려 드리고, 못 판 물건은 나눔이나 기부로 이어 드릴게요. 회사나 학교 비품 관리로도 넓혀 가고요.", "산 순간부터 다 쓸 때까지, 갈무리가 챙기겠습니다. 지금까지 갈무리였습니다. 감사합니다. (깊게 인사. 질의응답 때는 ←로 19장 QR로 돌아가 띄워 둘 것)"]}, {"sec": "출시 이후", "no": "22장", "t": "끝 화면", "l": ["(21장에서 \"감사합니다\" 하며 [→]) 초록이 차오르고 로고가 한 자씩 뜬 뒤 \"감사합니다\"가 나와요. 다 뜬 뒤 깊게 인사하고, 박수가 끝날 때까지 띄워 둡니다."]}, {"sec": "질문", "no": "Q1", "t": "앱을 유료로 판매하지 않고 왜 무료로 두나요?", "l": ["저희 수익은 앱을 파는 데서가 아니라 물건이 돌고 도는 데서 나오기 때문이에요. 쓰는 분이 많아질수록 사들일 수 있는 중고가 많아지고, 그게 곧 마켓 매출이 됩니다."], "qa": 1}, {"sec": "질문", "no": "Q2", "t": "매입한 중고가 팔리지 않으면 재고 부담이 생기지 않나요?", "l": ["아무거나 사지는 않아요. 갈무리는 언제 샀는지, 어떤 모델인지 이미 알고 있어서, 시세가 안정적인 물건만 골라서 가격을 제안할 수 있습니다. 처음에는 이어폰이나 태블릿처럼 거래가 많은 것부터 시작하려고 해요."], "qa": 1}, {"sec": "질문", "no": "Q3", "t": "결제 정보는 실제로 어떻게 가져오나요?", "l": ["오늘 보신 건 흐름을 확인하려고 만든 시제품이에요. 실제 서비스에서는 사용자가 직접 연결을 허락한 쇼핑몰의 주문 내역만 읽고, 마이데이터 연동도 검토하고 있습니다."], "qa": 1}, {"sec": "질문", "no": "Q4", "t": "개인정보 우려는 없나요?", "l": ["연결은 사용자가 고른 곳만, 그리고 언제든 끊을 수 있게 만들 거예요. 물건 이름이랑 날짜만 쓰고, 카드 번호 같은 결제 정보는 저장하지 않습니다."], "qa": 1}, {"sec": "질문", "no": "Q5", "t": "당근마켓, 번개장터와는 무엇이 다릅니까?", "l": ["그쪽은 \"팔아야겠다\" 마음먹은 순간부터 시작하고, 갈무리는 산 순간부터 시작해요. 그래서 팔 때 글을 미리 써 두고 두 곳에 한 번에 올려 드릴 수 있죠. 경쟁자라기보다는 그쪽으로 물건을 보내 주는 통로에 가깝습니다."], "qa": 1}, {"sec": "질문", "no": "Q6", "t": "냉장고 관리 앱은 이미 많지 않습니까?", "l": ["대부분 직접 입력해야 해서 오래 못 쓰게 되거든요. 갈무리는 결제하면 알아서 들어오고, 음식뿐 아니라 가전 보증이랑 중고 판매까지 한 번에 이어집니다."], "qa": 1}, {"sec": "질문", "no": "Q7", "t": "전 연령을 노리면 너무 넓지 않습니까?", "l": ["물건을 사고 챙기는 건 나이랑 상관없는 일이라서요. 다만 나이마다 많이 쓰는 기능이 달라요. 20~30대는 자동 등록이랑 중고 판매, 30~40대는 가족 공유, 50대 이상은 자녀가 대신 챙기는 기능. 앱은 하나지만 나이에 따라 다른 얼굴을 보여 주는 셈이에요."], "qa": 1}, {"sec": "질문", "no": "Q8", "t": "다음 단계는 무엇입니까?", "l": ["주변 1인 가구분들께 실제로 써 보게 해서, 한 달 뒤에도 앱을 여는지부터 확인하려고 합니다. 그 숫자가 저희한테는 제일 중요한 검증 기준이에요."], "qa": 1}];
/* 홈 화면 앱으로 열면 아이폰이 화면 높이를 상태바만큼 짧게 알려줘서 아래가 빈다. 그때는 실제 화면 높이로 늘린다 */
(function(){if(!navigator.standalone)return;const R=document.documentElement,B=document.body,ap=document.querySelector('.app'),sh=document.getElementById('sheet');
 /* 보이는 화면보다 짧게 잘리던 건 html이 화면 밖을 잘라냈기 때문. 홈 화면 앱에서는 문서 자체를 실제 화면 높이로 키우고 손가락 스크롤은 막는다 */
 const fit=()=>{const tall=innerHeight>innerWidth,h=tall?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
  if(h>innerHeight){R.style.overflow=B.style.overflow='visible';R.style.height=B.style.height=h+'px';
   [ap,sh].forEach(e=>{e.style.position='absolute';e.style.inset='0 0 auto 0';e.style.height=h+'px'});scrollTo(0,0)}};
 fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));addEventListener('scroll',()=>{if(scrollY)scrollTo(0,0)})})();
const $=id=>document.getElementById(id),stage=$('stage');
const NX='<span class="nx" aria-label="넘기기">넘기기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
/* 한 줄을 그린다: 괄호로만 된 줄은 행동 지시 상자, 문장 속 괄호는 흐리게, [→]는 넘기기 표시 */
function line(t){const s=t.trim();
 if(/^\([^)]*\)$/.test(s)||/^\(.*\)\s*\[→\]$/.test(s)&&!/\)\s+\S/.test(s.replace(/\[→\]$/,'')))return `<p class="cue">${esc(s).replace('[→]',NX)}</p>`;
 return `<p class="say">${esc(s).replace(/\(([^()]+)\)/g,'<span class="c">($1)</span>').replace(/\[→\]/g,NX)}</p>`}
let cur=0,el=null,busy=0;
/* 들어올 때마다 맨 처음 장부터 */
function draw(i,dir){const s=S[i];const c=document.createElement('article');c.className='card'+(s.qa?' qa':'');
 c.innerHTML=`<div class="in"><div class="no"><b>${esc(s.no)}</b><span>${esc(s.t)}</span></div><div class="ls">${s.l.map(line).join('')}</div></div>`;
 /* 카드 안 스크롤은 그대로 두고, 탭은 위에 깔린 좌우 버튼이 받는다 */
 stage.appendChild(c);
 if(el){const o=el;o.classList.add(dir>0?'leave-r':'leave-l');setTimeout(()=>o.remove(),330)}
 if(dir)c.classList.add(dir>0?'enter-r':'enter-l');el=c;
 $('sec').textContent=s.sec;$('cnt').textContent=(i+1)+' / '+S.length;$('bar').style.width=((i+1)/S.length*100)+'%';
 const n=S[i+1];$('next').innerHTML=n?`<em>다음</em><span>${esc(n.no)} · ${esc(n.t)}</span>`:'<em>끝</em><span>마지막 장이에요</span>';
}
function go(d){const n=cur+d;if(n<0||n>=S.length){nudge(d);return}cur=n;draw(cur,d);flash(d);hideHint()}
function nudge(d){if(!el)return;el.animate([{transform:'translateX(0)'},{transform:`translateX(${d*-14}px)`},{transform:'translateX(0)'}],{duration:280,easing:'ease-out'})}
function flash(d){const f=$(d>0?'fr':'fl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
/* 탭: 왼쪽 반 이전, 오른쪽 반 다음 / 밀기도 된다 / 위아래로 움직이면 글을 넘겨 읽는 것으로 본다 */
let sx=0,sy=0,moved=0,lt=0,lid='';
['tl','tr'].forEach(id=>{const b=$(id);
 b.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=0});
 b.addEventListener('pointermove',e=>{if(Math.abs(e.clientY-sy)>10){moved=1;if(el)el.scrollTop-=e.movementY||0}});
 b.addEventListener('click',e=>{const dx=e.clientX-sx;if(Math.abs(dx)>50){lt=0;return go(dx<0?1:-1)}if(moved)return;
  /* 같은 쪽을 빠르게 두 번 눌러야 넘어가고, 계속 빠르게 누르면 그만큼 계속 넘어간다 */
  const now=Date.now();if(lid===id&&now-lt<380){lt=now;go(id==='tr'?1:-1)}else{lt=now;lid=id}})});
stage.addEventListener('wheel',e=>{if(el)el.scrollTop+=e.deltaY},{passive:true});
addEventListener('keydown',e=>{if($('sheet').classList.contains('on')){if(e.key==='Escape')sheet(0);return}
 if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}});

/* 목록과 글자 크기 */
function sheet(on){$('sheet').classList.toggle('on',!!on);$('sheet').setAttribute('aria-hidden',!on);if(on){list();const c=$('lst').querySelector('.cur');c&&c.scrollIntoView({block:'center'})}}
function list(){let h='',sec='';S.forEach((s,i)=>{if(s.sec!==sec){sec=s.sec;h+=`<h4>${esc(sec)}</h4>`}h+=`<button data-i="${i}"${i===cur?' class="cur"':''}><em>${esc(s.no)}</em>${esc(s.t)}</button>`});$('lst').innerHTML=h}
$('menu').onclick=()=>sheet(1);$('scrim').onclick=()=>sheet(0);
$('lst').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;const d=i>cur?1:-1;sheet(0);if(i!==cur){cur=i;draw(cur,d)}};
let fs=0;try{fs=+localStorage.getItem('script.fs2')||0}catch(e){}
const setFs=v=>{fs=Math.max(-3,Math.min(5,v));document.documentElement.style.setProperty('--fs',`calc(${innerWidth>=900?34:27}px + ${fs*3}px)`);try{localStorage.setItem('script.fs2',fs)}catch(e){}};setFs(fs);
$('fm').onclick=$('fm2').onclick=()=>setFs(fs-1);$('fp').onclick=$('fp2').onclick=()=>setFs(fs+1);
draw(cur,0);
/* 뒤로 가기로 돌아와도(페이지 캐시) 처음 장부터 다시 */
addEventListener('pageshow',e=>{if(e.persisted){sheet(0);stage.querySelectorAll('.card').forEach(c=>c.remove());el=null;cur=0;draw(0,0);const a=document.querySelector('.app');a.classList.remove('in');void a.offsetWidth;a.classList.add('in')}});
</script>
</body>
</html>
