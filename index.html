<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="앱"><link rel="apple-touch-icon" href="buds.png"><title>앱 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
/* 한 줄 기둥: 위에 질문, 아래에 앱 하나당 큰 판 하나. 판이 곧 그 앱의 얼굴이다 */
:root{
  --bg:#000;--ink:#f5f5f7;--mut:#98989f;--card:#1c1c1e;
  --g:#22D873;--gtx:#04281A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  transition:transform .5s cubic-bezier(.55,0,.8,.4),opacity .35s ease-in .1s,filter .5s ease-in}
.wrap.go{transform:scale(1.08);opacity:0;filter:blur(14px)}
h1{margin:0 4px 6px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.app{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between;height:220px;padding:22px;border-radius:30px;overflow:hidden;
  transition:transform .4s cubic-bezier(.3,1.35,.4,1)}
.app:active{transform:scale(.97);transition-duration:.12s}
.app:focus-visible{outline:3px solid #fff;outline-offset:3px}
.buds{background:var(--card);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.14),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.3)}
.buds img{position:absolute;right:18px;top:50%;width:150px;height:auto;margin-top:-62px;filter:drop-shadow(0 16px 24px rgba(0,0,0,.6));animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.buds .nm{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.buds .ds{font-size:14px;color:var(--mut);margin-top:4px}
.galmuri{background:var(--g)}
.galmuri .wm{font-family:"Bricolage Grotesque",var(--font);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.045em;color:var(--gtx);align-self:flex-start;margin-top:auto}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink);opacity:0;transition:opacity .3s}
.tag.on{opacity:1}
.galmuri .tag{background:rgba(4,40,26,.14);color:var(--gtx)}
.foot{margin:6px 0 0;font-size:13px;color:var(--mut);text-align:center;text-wrap:balance}
.in{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*70ms)}
@keyframes up{from{transform:translateY(14px);opacity:.001}}
.boot{position:fixed;inset:0;z-index:50;background:var(--g);display:grid;place-items:center;will-change:clip-path}
.boot b{display:flex;font-family:"Bricolage Grotesque",var(--font);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.05em;color:#000}
.boot b span{display:inline-block;animation:lt .7s cubic-bezier(.3,1.35,.4,1) backwards;animation-delay:calc(.28s + var(--i)*45ms)}
@keyframes lt{from{opacity:0;transform:translateY(46px) rotate(10deg)}}
@media (prefers-reduced-motion:reduce){.boot b span{animation:none}.buds img,.in{animation:none}.wrap{transition:opacity .2s}.wrap.go{transform:none;filter:none}}
</style></head><body>

<style>
/* 컴퓨터에서 열면: 아이폰 목업 안에 띄움 */
.mock body{overflow:hidden}
.mock .wrap{display:none}
.mk{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(60% 50% at 50% 38%,#1d2333 0%,#0b0d12 55%,#050507 100%);overflow:hidden}
.mk-stage{display:flex;flex-direction:column;align-items:center;gap:20px;transform-origin:50% 50%}
.mk-phone{position:relative;width:460px;height:909px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
.mk-frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;user-select:none}
.mk-screen{position:absolute;left:35px;top:31px;width:390px;height:847px;border-radius:52px;overflow:hidden;background:#000}
.mk-screen iframe{position:absolute;left:0;top:47px;width:390px;height:800px;border:0;background:#000}
.mk-status{position:absolute;inset:0 0 auto;height:47px;z-index:2;pointer-events:none;color:#fff;
  font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.mk-time{position:absolute;left:0;width:94px;top:15px;text-align:center}
.mk-ic{position:absolute;right:0;width:94px;top:16px;display:flex;gap:5px;justify-content:center;align-items:center}
.mk-ic svg{height:11px;width:auto}
.mk-home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.75);z-index:3;pointer-events:none}
.mk-cap{margin:0;color:#8e93a3;font:500 13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:.02em;text-align:center}
</style>
<script>
(()=>{
  const desk=matchMedia('(min-width: 700px) and (pointer: fine)').matches;
  if(!desk||location.hash==='#phone')return;
  document.documentElement.classList.add('mock');
  const base=location.href.split('#')[0];
  const mk=document.createElement('div');mk.className='mk';
  mk.innerHTML=`<div class="mk-stage"><div class="mk-phone"><div class="mk-screen"><div class="mk-status"><span class="mk-time"></span><span class="mk-ic"><svg viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg viewBox="0 0 16 12" fill="#fff"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.3-1.3A10.3 10.3 0 0 0 8 .4 10.3 10.3 0 0 0 .7 3.4L2 4.7a8.5 8.5 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.3A6.6 6.6 0 0 0 8 4 6.6 6.6 0 0 0 3.3 5.9l1.3 1.3A4.8 4.8 0 0 1 8 5.9zm0 3.6c.4 0 .8.2 1.1.5L8 11.1 6.9 10c.3-.3.7-.5 1.1-.5z"/></svg>
      <svg viewBox="0 0 28 12" fill="none"><rect x=".5" y=".5" width="23" height="11" rx="3.5" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#fff"/><path d="M25.5 4v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".45"/></svg>
    </span></div><iframe title="앱 고르기" src="${base}#phone"></iframe><div class="mk-home"></div></div><img class="mk-frame" src="frame.png" alt="" draggable="false"></div>
    <p class="mk-cap">휴대폰으로 열면 전체 화면으로 보여요</p></div>`;
  document.body.appendChild(mk);
  const st=mk.querySelector('.mk-stage'),tm=mk.querySelector('.mk-time');
  const fit=()=>{const s=Math.min(1,(innerHeight-40)/(909+20+18),(innerWidth-40)/460);st.style.transform=`scale(${s})`};
  const clock=()=>{const d=new Date();tm.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')};
  fit();clock();addEventListener('resize',fit);setInterval(clock,15000);
  window.__MOCK=1;
})();
</script>
<main class="wrap" id="wrap">
  <h1 class="in" style="--k:0">어떤 앱을 열까요?</h1>
  <button class="app buds in" style="--k:1" data-href="v4.html" id="buds">
    <span class="tag">마지막으로 봄</span>
    <span><span class="nm" style="display:block">Galaxy Buds4 Pro</span><span class="ds" style="display:block">for iOS 27</span></span>
    <img src="buds.png" alt="">
  </button>
  <button class="app galmuri in" style="--k:2" data-href="galmuri.html" id="galmuri" aria-label="Galmuri">
    <span class="tag">마지막으로 봄</span>
    <span class="wm" aria-hidden="true">Galmuri.</span>
  </button>
  <p class="foot in" style="--k:3">앱 안에서 나가기를 누르면 이 화면으로 돌아와요</p>
</main>

<script>
(()=>{
  if(window.__MOCK)return;
  const wrap=document.getElementById('wrap');
  let last=null;try{last=localStorage.getItem('apps.last')}catch(_){}
  if(last){const b=document.getElementById(last);if(b)b.querySelector('.tag').classList.add('on')}
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* 갈무리: 판이 화면만큼 커지면서 초록 화면에 로고가 올라온다. 앱이 같은 화면에서 이어 받는다 */
  const boot=b=>{const r=b.getBoundingClientRect(),W=innerWidth,H=innerHeight,el=document.createElement('div');el.className='boot';
    el.innerHTML='<b>'+[...'Galmuri.'].map((c,k)=>`<span style="--i:${k}">${c}</span>`).join('')+'</b>';document.body.appendChild(el);
    const from=`inset(${r.top}px ${W-r.right}px ${H-r.bottom}px ${r.left}px round 30px)`;
    if(!reduce)el.animate([{clipPath:from},{clipPath:'inset(0px 0px 0px 0px round 0px)'}],{duration:560,easing:'cubic-bezier(.5,0,.15,1)'});
    setTimeout(()=>{location.href=b.dataset.href+'?l=1'},reduce?150:1150)};
  document.querySelectorAll('.app').forEach(b=>b.addEventListener('click',()=>{
    try{localStorage.setItem('apps.last',b.id)}catch(_){}
    if(b.id==='galmuri')return boot(b);
    wrap.classList.add('go');
    setTimeout(()=>{location.href=b.dataset.href+'?l=1'},reduce?120:420);
  }));
  /* 뒤로 돌아왔을 때(페이지 캐시 복원) 화면이 사라진 채로 남지 않게 */
  addEventListener('pageshow',e=>{if(e.persisted){wrap.classList.remove('go');document.querySelectorAll('.boot').forEach(x=>x.remove())}});
})();
</script>
</body></html>
