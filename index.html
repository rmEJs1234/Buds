<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="이어버드"><link rel="apple-touch-icon" href="buds.png"><title>Galaxy Buds4 Pro for iOS 27</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one iPhone-width column — floating earbuds, a question, then a grouped list of versions like an iOS Settings section */
:root{
  --bg:#000;--card:rgba(255,255,255,.07);--card-hi:rgba(255,255,255,.12);--line:rgba(255,255,255,.1);
  --ink:#f5f5f7;--mut:#98989f;--accent:#3a9cff;--new:#34c759;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  transition:transform .5s cubic-bezier(.55,0,.8,.4),opacity .35s ease-in .1s,filter .5s ease-in}
.wrap.go{transform:scale(1.08);opacity:0;filter:blur(14px)}
.hero{display:grid;place-items:center;padding-top:10px;position:relative}
.hero img{width:150px;height:auto;filter:drop-shadow(0 16px 24px rgba(0,0,0,.6));animation:fl 6s ease-in-out infinite}
.hero::after{content:"";position:absolute;bottom:-6px;left:50%;width:96px;height:10px;margin-left:-48px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);filter:blur(3px);animation:sh 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes sh{50%{transform:scale(.85);opacity:.6}}
.eyebrow{margin:0;font-size:13px;letter-spacing:.06em;color:var(--mut);text-align:center}
h1{margin:4px 0 0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-align:center;text-wrap:balance}
.list{display:flex;flex-direction:column;border-radius:26px;background:var(--card);overflow:hidden;
  box-shadow:inset 0 0 0 .6px rgba(255,255,255,.14),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.35)}
.v{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;position:relative;transition:background .3s}
.v+.v::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--line)}
.v:active{background:var(--card-hi);transition:background .05s}
.v:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:22px}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);color:var(--ink);
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.2)}
.v.latest .num{background:var(--accent);box-shadow:none;color:#fff}
.tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.tt{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ds{font-size:13px;color:var(--mut)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.tag.new{background:rgba(52,199,89,.16);color:var(--new)}
.tag.last{background:rgba(58,156,255,.16);color:var(--accent)}
.cv{width:9px;height:15px;color:var(--mut)}
.foot{margin:0;font-size:13px;color:var(--mut);text-align:center;text-wrap:balance}
.in{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*60ms)}
@keyframes up{from{transform:translateY(14px);opacity:.001}}
@media (prefers-reduced-motion:reduce){.hero img,.hero::after,.in{animation:none}.wrap{transition:opacity .2s}.wrap.go{transform:none;filter:none}}
</style></head><body>

<style>
/* 컴퓨터에서 열면: 아이폰 목업 안에 앱을 띄움 */
.mock body{overflow:hidden}
.mock .wrap{display:none}
.mk{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(60% 50% at 50% 38%,#1d2333 0%,#0b0d12 55%,#050507 100%);overflow:hidden}
.mk-stage{display:flex;flex-direction:column;align-items:center;gap:22px;transform-origin:50% 50%}
.mk-phone{position:relative;width:417px;height:876px;border-radius:68px;padding:12px;
  background:linear-gradient(145deg,#5b5e66,#2a2c31 30%,#1b1c20 60%,#4a4d55);
  box-shadow:0 0 0 1.5px #0d0e10,inset 0 0 0 1.5px rgba(255,255,255,.18),inset 0 0 0 5px #121316,0 40px 90px rgba(0,0,0,.65),0 12px 30px rgba(0,0,0,.4)}
.mk-btn{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3c42,#5e6169)}
.mk-btn.a{left:-4px;top:150px;height:32px}.mk-btn.b{left:-4px;top:205px;height:62px}.mk-btn.c{left:-4px;top:280px;height:62px}.mk-btn.d{right:-4px;top:230px;height:100px}
.mk-screen{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000}
.mk-screen iframe{position:absolute;left:0;top:54px;width:393px;height:798px;border:0;background:#000}
.mk-status{position:absolute;inset:0 0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;
  color:#fff;font:600 17px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;z-index:2;pointer-events:none}
.mk-status svg{height:12px;width:auto}
.mk-ic{display:flex;gap:6px;align-items:center}
.mk-island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:3}
.mk-home{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:rgba(255,255,255,.75);z-index:3;pointer-events:none}
.mk-cap{margin:0;color:#8e93a3;font:500 13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:.02em;text-align:center}
.mk-cap b{color:#d9dce6;font-weight:600}
</style>
<script>
(()=>{
  const desk=matchMedia('(min-width: 700px) and (pointer: fine)').matches;
  if(!desk||location.hash==='#phone')return;
  document.documentElement.classList.add('mock');
  const base=location.href.split('#')[0];
  const mk=document.createElement('div');mk.className='mk';
  mk.innerHTML=`<div class="mk-stage"><div class="mk-phone"><i class="mk-btn a"></i><i class="mk-btn b"></i><i class="mk-btn c"></i><i class="mk-btn d"></i>
    <div class="mk-screen"><div class="mk-status"><span class="mk-time"></span><span class="mk-ic">
      <svg viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg viewBox="0 0 16 12" fill="#fff"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.3-1.3A10.3 10.3 0 0 0 8 .4 10.3 10.3 0 0 0 .7 3.4L2 4.7a8.5 8.5 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.3A6.6 6.6 0 0 0 8 4 6.6 6.6 0 0 0 3.3 5.9l1.3 1.3A4.8 4.8 0 0 1 8 5.9zm0 3.6c.4 0 .8.2 1.1.5L8 11.1 6.9 10c.3-.3.7-.5 1.1-.5z"/></svg>
      <svg viewBox="0 0 28 12" fill="none"><rect x=".5" y=".5" width="23" height="11" rx="3.5" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#fff"/><path d="M25.5 4v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".45"/></svg>
    </span></div><div class="mk-island"></div><iframe title="Galaxy Buds4 Pro" src="${base}#phone"></iframe><div class="mk-home"></div></div></div>
    <p class="mk-cap"><b>Galaxy Buds4 Pro</b> for iOS 27 · 휴대폰으로 열면 전체 화면으로 보여요</p></div>`;
  document.body.appendChild(mk);
  const st=mk.querySelector('.mk-stage'),tm=mk.querySelector('.mk-time');
  const fit=()=>{const s=Math.min(1,(innerHeight-40)/(876+22+18),(innerWidth-40)/417);st.style.transform=`scale(${s})`};
  const clock=()=>{const d=new Date();tm.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')};
  fit();clock();addEventListener('resize',fit);setInterval(clock,15000);
  window.__MOCK=1;
})();
</script>
<main class="wrap" id="wrap">
  <div class="hero in" style="--k:0"><img src="buds.png" alt="Galaxy Buds4 Pro 이어버드"></div>
  <div class="in" style="--k:1">
    <p class="eyebrow">Galaxy Buds4 Pro for iOS 27</p>
    <h1>어떤 버전으로 열까요?</h1>
  </div>
  <nav class="list in" style="--k:2" aria-label="버전 목록">
    <button class="v latest" data-href="v4.html" id="v4"><span class="num">4</span><span class="tx"><span class="tt">개선 버전 <span class="tag new">최신</span></span><span class="ds">리퀴드 글라스 렌즈, 유리 툴바, 밀어서 뒤로가기까지 전부 다듬은 버전</span></span><svg class="cv" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L7 7l-5.5 5.5"/></svg></button>
    <button class="v" data-href="v3.html" id="v3"><span class="num">3</span><span class="tx"><span class="tt">토글 · 블러 수정</span><span class="ds">토글 꾹 누르기와 이어버드 나올 때 블러까지 고친 버전</span></span><svg class="cv" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L7 7l-5.5 5.5"/></svg></button>
    <button class="v" data-href="v2.html" id="v2"><span class="num">2</span><span class="tx"><span class="tt">꾹 누르기 수정</span><span class="ds">꾹 누르면 투명해지는 효과만 고친 버전</span></span><svg class="cv" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L7 7l-5.5 5.5"/></svg></button>
    <button class="v" data-href="v1.html" id="v1"><span class="num">1</span><span class="tx"><span class="tt">이전 버전</span><span class="ds">처음 받은 그대로의 원본</span></span><svg class="cv" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L7 7l-5.5 5.5"/></svg></button>
  </nav>
  <p class="foot in" style="--k:3">앱 안에서 왼쪽 위 나가기 버튼을 누르면 이 화면으로 돌아와요</p>
</main>

<script>
(()=>{
  if(window.__MOCK)return;
  const wrap=document.getElementById('wrap');
  let last=null;try{last=localStorage.getItem('buds.last')}catch(_){}
  if(last){const b=document.getElementById(last);if(b){const t=document.createElement('span');t.className='tag last';t.textContent='마지막으로 봄';b.querySelector('.tt').appendChild(t)}}
  document.querySelectorAll('.v').forEach(b=>b.addEventListener('click',()=>{
    try{localStorage.setItem('buds.last',b.id)}catch(_){}
    wrap.classList.add('go');
    const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    setTimeout(()=>{location.href=b.dataset.href+'?l=1'},reduce?120:420);
  }));
  /* 뒤로 돌아왔을 때(페이지 캐시 복원) 화면이 사라진 채로 남지 않게 */
  addEventListener('pageshow',e=>{if(e.persisted)wrap.classList.remove('go')});
})();
</script>
</body></html>
